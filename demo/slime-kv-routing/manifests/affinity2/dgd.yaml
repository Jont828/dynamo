apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: slime-sglang
spec:
  backendFramework: sglang
  components:
    - name: frontend
      type: frontend
      replicas: 1
      podTemplate:
        metadata:
          labels:
            dynamo.nvidia.com/slime-role: frontend
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.6.1
              env:
                - name: DYN_SGLANG_ENABLE_GENERATE
                  value: "1"
                - name: DYN_ROUTER_MODE                 # KV-aware routing instead of round-robin
                  value: kv
                - name: DYN_ROUTER_PREDICTED_TTL_SECS   # keep a prompt's sibling samples together
                  value: "5"                            # before the engine's first KV event arrives
                - name: DYN_ROUTER_KV_OVERLAP_SCORE_CREDIT  # experiment: 3 blocks of credit per cached block.
                  value: "3"                                # A sibling's 5 shared blocks earn 15; the one
                                                            # system-prompt block every prompt shares earns 3,
                                                            # less than a new prompt's ~6-block prefill
                - name: DYN_ROUTER_PREFILL_LOAD_SCALE       # experiment: weigh prefill 4x against decode
                  value: "4"                                # load, so that credit outweighs a busier engine
    - name: worker-0
      type: worker
      replicas: 1
      podTemplate:
        metadata:
          labels:
            dynamo.nvidia.com/slime-role: worker-0
        spec:
          volumes:
            - name: slime-data
              persistentVolumeClaim:
                claimName: slime-data
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.1
              command:
                - python3
                - -m
                - sglang.launch_server
              args:
                - --model-path
                - /data/models/Qwen3-0.6B
                - --served-model-name
                - Qwen/Qwen3-0.6B
                - --host
                - 0.0.0.0
                - --port
                - "30000"
                - --grpc-port
                - "30001"
                - --incremental-streaming-output
                - --page-size                           # KV block size that the router hashes
                - "16"
                - --kv-events-config                    # publish KV-cache events; the sidecar relays them
                - '{"publisher":"zmq","endpoint":"tcp://*:5557","topic":""}'
                - --sidecar
                - dynamo.sglang.sidecar
                - --sidecar-args
                - '["--grpc-endpoint","http://127.0.0.1:30001"]'
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: slime-data
                  mountPath: /data
              startupProbe:
                httpGet:
                  path: /health_generate
                  port: 30000
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /health_generate
                  port: 30000
                periodSeconds: 10
                timeoutSeconds: 5
    - name: worker-1
      type: worker
      replicas: 1
      podTemplate:
        metadata:
          labels:
            dynamo.nvidia.com/slime-role: worker-1
        spec:
          volumes:
            - name: slime-data
              persistentVolumeClaim:
                claimName: slime-data
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.1
              command:
                - python3
                - -m
                - sglang.launch_server
              args:
                - --model-path
                - /data/models/Qwen3-0.6B
                - --served-model-name
                - Qwen/Qwen3-0.6B
                - --host
                - 0.0.0.0
                - --port
                - "30000"
                - --grpc-port
                - "30001"
                - --incremental-streaming-output
                - --page-size                           # KV block size that the router hashes
                - "16"
                - --kv-events-config                    # publish KV-cache events; the sidecar relays them
                - '{"publisher":"zmq","endpoint":"tcp://*:5557","topic":""}'
                - --sidecar
                - dynamo.sglang.sidecar
                - --sidecar-args
                - '["--grpc-endpoint","http://127.0.0.1:30001"]'
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: slime-data
                  mountPath: /data
              startupProbe:
                httpGet:
                  path: /health_generate
                  port: 30000
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /health_generate
                  port: 30000
                periodSeconds: 10
                timeoutSeconds: 5
