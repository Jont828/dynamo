# Rendered from ai-dynamo/dynamo examples/rl/slime/dynamo.yaml (unchanged from v1.5.0 through main) with
# DYNAMO_FRONTEND_IMAGE/SGLANG_RUNTIME_IMAGE at 1.6.1 (the installed dynamo-platform version).
# Lines marked "slime-dynamo-aks:" are the only changes; they let the SGLang engines read the same
# shared volume as the trainer, which slime's disk weight-update transport requires.
#
# Each engine Service must select exactly one engine. Slime uses this fixed
# worker set for control requests.
#
# Keep each worker component at one replica.
apiVersion: v1
kind: Service
metadata:
  name: slime-sglang-rollout
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    dynamo.nvidia.com/slime-role: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: slime-sglang-engine-0
spec:
  ports:
    - name: sglang-http
      port: 30000
      targetPort: 30000
  selector:
    dynamo.nvidia.com/slime-role: worker-0
---
apiVersion: v1
kind: Service
metadata:
  name: slime-sglang-engine-1
spec:
  ports:
    - name: sglang-http
      port: 30000
      targetPort: 30000
  selector:
    dynamo.nvidia.com/slime-role: worker-1
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: slime-sglang
spec:
  backendFramework: sglang
  components:
    - name: frontend
      type: frontend
      replicas: 1
      runtimeVersionOverride: 1.6.1
      podTemplate:
        metadata:
          labels:
            dynamo.nvidia.com/slime-role: frontend
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.6.1
              env:
                - name: DYN_SGLANG_ENABLE_GENERATE
                  value: "1"
    - name: worker-0
      type: worker
      replicas: 1
      runtimeVersionOverride: 1.6.1
      podTemplate:
        metadata:
          labels:
            dynamo.nvidia.com/slime-role: worker-0
        spec:
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          volumes: # slime-dynamo-aks: Lustre sub-dir volume shared with the trainer (storage.yaml)
            - name: data
              persistentVolumeClaim:
                claimName: slime-dynamo-data
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.1
              startupProbe:
                httpGet:
                  path: /health_generate
                  port: 30000
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /health_generate
                  port: 30000
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              envFrom:
                - secretRef:
                    name: hf-token-secret
                    optional: true
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts: # slime-dynamo-aks: /data holds the model and /data/weight-updates
                - name: data
                  mountPath: /data
              command:
                - python3
                - -m
                - sglang.launch_server
              args:
                - --model-path
                - /data/Qwen3-0.6B # slime-dynamo-aks: same HF checkpoint as the trainer's --hf-checkpoint
                - --served-model-name
                - Qwen/Qwen3-0.6B
                - --host
                - 0.0.0.0
                - --port
                - "30000"
                - --grpc-port
                - "30001"
                - --incremental-streaming-output
                - --sidecar
                - dynamo.sglang.sidecar
                - --sidecar-args
                - '["--grpc-endpoint","http://127.0.0.1:30001"]'
    - name: worker-1
      type: worker
      replicas: 1
      runtimeVersionOverride: 1.6.1
      podTemplate:
        metadata:
          labels:
            dynamo.nvidia.com/slime-role: worker-1
        spec:
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          volumes: # slime-dynamo-aks: Lustre sub-dir volume shared with the trainer (storage.yaml)
            - name: data
              persistentVolumeClaim:
                claimName: slime-dynamo-data
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.1
              startupProbe:
                httpGet:
                  path: /health_generate
                  port: 30000
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /health_generate
                  port: 30000
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              envFrom:
                - secretRef:
                    name: hf-token-secret
                    optional: true
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts: # slime-dynamo-aks: /data holds the model and /data/weight-updates
                - name: data
                  mountPath: /data
              command:
                - python3
                - -m
                - sglang.launch_server
              args:
                - --model-path
                - /data/Qwen3-0.6B # slime-dynamo-aks: same HF checkpoint as the trainer's --hf-checkpoint
                - --served-model-name
                - Qwen/Qwen3-0.6B
                - --host
                - 0.0.0.0
                - --port
                - "30000"
                - --grpc-port
                - "30001"
                - --incremental-streaming-output
                - --sidecar
                - dynamo.sglang.sidecar
                - --sidecar-args
                - '["--grpc-endpoint","http://127.0.0.1:30001"]'
