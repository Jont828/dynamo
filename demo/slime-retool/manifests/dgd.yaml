          volumeMounts:
          - name: slime-data
            mountPath: /data
          startupProbe:
            httpGet:
              path: /health_generate
              port: 30000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health_generate
