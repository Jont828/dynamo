# Dynamo serves the ReTool rollouts: a frontend with KV-aware routing and four
# 1-GPU SGLang engines (worker-0..3) that load Slime's ReTool SFT checkpoint.
# Settings are the ones from ../slime-kv-routing/manifests/kv/dgd.yaml (the
# KV phase of the first experiment), applied to four engines:
#   frontend: DYN_ROUTER_MODE=kv, DYN_ROUTER_PREDICTED_TTL_SECS=5, and
#             DYN_SGLANG_ENABLE_GENERATE=1 (SGLang's native /generate, token in/out)
#   engines:  --page-size 16 (the KV block size the router hashes) and
#             --kv-events-config (ZMQ); the SGLang sidecar relays the events.
# Slime syncs weights straight to each engine through engine-services.yaml.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: slime-sglang
spec:
  backendFramework: sglang
  components:
  - name: frontend
    type: frontend
    replicas: 1
    podTemplate:
      metadata:
        labels:
          dynamo.nvidia.com/slime-role: frontend
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.6.1
          env:
          - name: DYN_SGLANG_ENABLE_GENERATE
            value: '1'
          - name: DYN_ROUTER_MODE
            value: kv
          - name: DYN_ROUTER_PREDICTED_TTL_SECS
            value: '5'
  - name: worker-0
    type: worker
    replicas: 1
    podTemplate:
      metadata:
        labels:
          dynamo.nvidia.com/slime-role: worker-0
      spec:
        volumes:
        - name: slime-data
          persistentVolumeClaim:
            claimName: slime-data
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.1
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - /data/models/qwen3-4b-sft
          - --served-model-name
          - font-info/qwen3-4b-sft-SGLang-RL
          - --host
          - 0.0.0.0
          - --port
          - '30000'
          - --grpc-port
          - '30001'
          - --incremental-streaming-output
          - --page-size
          - '16'
          - --kv-events-config
          - '{"publisher":"zmq","endpoint":"tcp://*:5557","topic":""}'
          - --sidecar
          - dynamo.sglang.sidecar
          - --sidecar-args
          - '["--grpc-endpoint","http://127.0.0.1:30001"]'
          resources:
            requests:
              nvidia.com/gpu: '1'
            limits:
              nvidia.com/gpu: '1'
          volumeMounts:
          - name: slime-data
            mountPath: /data
          startupProbe:
            httpGet:
              path: /health_generate
              port: 30000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health_generate
              port: 30000
            periodSeconds: 10
            timeoutSeconds: 5
  - name: worker-1
    type: worker
    replicas: 1
    podTemplate:
      metadata:
