# kubectl apply -k .   creates the two things every run uses:
#   - ConfigMap verl-dynamo-demo-scripts: scripts/ (mounted at /opt/verl-dynamo-demo)
#   - PVC verl-dynamo-cache: verl build, wheelhouse, model, data and run logs
# Then: kubectl apply -f k8s/setup-job.yaml (one-time), kubectl apply -f k8s/rayjob.yaml (each run).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - k8s/cache-pvc.yaml
configMapGenerator:
  - name: verl-dynamo-demo-scripts
    files:
      - scripts/apply-accelerate-fix.sh
      - scripts/build-env.sh
      - scripts/cleanup-orphans.sh
      - scripts/env.sh
      - scripts/pod-bootstrap.sh
      - scripts/rayjob-entrypoint.sh
      - scripts/report_run.py
      - scripts/run-demo-train.sh
      - scripts/setup-cache.sh
      - scripts/summarize_run.py
      - scripts/verl_dynamo_kitlog.py
      - scripts/watch_run.py
generatorOptions:
  # Fixed name, so the Job and RayJob manifests can reference it directly.
  disableNameSuffixHash: true
