# Sandbox CI for the Orka PR shepherd demo. It exists only on orka-demo/base in
# Jont828/dynamo, where Dynamo's own workflows are removed, so a sandbox pull
# request runs one fast check instead of Dynamo's full CI.
name: orka-demo-ci

on:
  pull_request:
    branches: ["orka-demo/**"]

permissions:
  contents: read

jobs:
  unit:
    name: deploy-utils unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Test the PR's head commit, as Dynamo's CI does (copy-pr-bot runs it on the head,
      # not on GitHub's merge with the base). So a fix that lands on the base reaches a
      # PR only once the PR is rebased onto it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pytest-asyncio pytest-benchmark pydantic pyyaml
      # test_dynamo_deployment.py needs the Kubernetes client libraries, which this
      # sandbox check doesn't install.
      - name: Run the deploy/utils unit tests
        run: >-
          python -m pytest -q -p no:cacheprovider deploy/utils/tests
          --ignore=deploy/utils/tests/test_dynamo_deployment.py
