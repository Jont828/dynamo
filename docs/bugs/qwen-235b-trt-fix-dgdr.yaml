apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeploymentRequest
metadata:
  name: ecommerce-shopping-assistant
  namespace: default
spec:
  model: Qwen/Qwen3-235B-A22B-FP8
  backend: trtllm
  searchStrategy: rapid
  autoApply: true
  image: jont828/dynamo-planner:trt-fix

  modelCache:
    pvcName: model-cache
    pvcMountPath: /home/dynamo/.cache/huggingface
    pvcModelPath: hub/models--Qwen--Qwen3-235B-A22B-FP8/snapshots/39eb2b067ea6b8e3e1dd97d3cd0c7ffeaf3e1a35

  workload:
    isl: 3000
    osl: 300

  sla:
    ttft: 500
    itl: 30

  features:
    planner:
      mode: disagg
      enable_throughput_scaling: true
      enable_load_scaling: true
      max_gpu_budget: 32

  overrides:
    dgd:
      apiVersion: nvidia.com/v1alpha1
      kind: DynamoGraphDeployment
      metadata:
        name: placeholder
      spec:
        services:
          prefill:
            sharedMemory:
              size: 256Gi
          decode:
            sharedMemory:
              size: 256Gi
