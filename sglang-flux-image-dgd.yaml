#
# FLUX.1-schnell text-to-image with SGLang. Cluster copy of
# examples/backends/sglang/deploy/agg_image_diffusion.yaml from PR #14660.
# Serving spec validated on 2026-09-10 against the 1.4.2 operator with matched
# 1.4.2 images; only the DGD name and namespace differ from the tested spec.
# Requests one H100. See diffusion-demo.md before deploying.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-flux-image-demo
  namespace: default
spec:
  backendFramework: sglang
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.4.2
        nodeSelector:
          agentpool: nodepool1
  - name: ImageDiffusionWorker
    type: worker
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        # Keeps Dynamo off PID 1; SGLang 0.5.16 in 1.4.2 kills its scheduler otherwise.
        shareProcessNamespace: true
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.2
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
          - --model-path
          - black-forest-labs/FLUX.1-schnell
          - --served-model-name
          - black-forest-labs/FLUX.1-schnell
          - --image-diffusion-worker
          - --media-output-fs-url
          - file:///tmp/dynamo_media
          - --trust-remote-code
          - --skip-tokenizer-init
          - --enable-metrics
          env:
          - name: HF_HOME
            value: /model-cache
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: '1'
            requests:
              nvidia.com/gpu: '1'
          volumeMounts:
          - name: media-output
            mountPath: /tmp/dynamo_media
          - name: model-cache
            mountPath: /model-cache
            subPath: dynamo-cache
        volumes:
        - name: media-output
          emptyDir:
            sizeLimit: 20Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: pvc-lustre-dynamo
        nodeSelector:
          agentpool: ndh100pool
