#
# FLUX.1-schnell text-to-image serving with SGLang. This is the Kubernetes
# equivalent of launch/image_diffusion.sh with --model-path overridden.
# Request response_format=b64_json unless media storage is externally served.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: flux-1-schnell-sglang-agg
spec:
  backendFramework: sglang
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/sglang-runtime:my-tag
  - name: ImageDiffusionWorker
    type: worker
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/sglang-runtime:my-tag
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
          - --model-path
          - black-forest-labs/FLUX.1-schnell
          - --served-model-name
          - black-forest-labs/FLUX.1-schnell
          - --image-diffusion-worker
          - --media-output-fs-url
          - file:///tmp/dynamo_media
          - --trust-remote-code
          - --skip-tokenizer-init
          - --enable-metrics
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: media-output
            mountPath: /tmp/dynamo_media
        volumes:
        - name: media-output
          emptyDir:
            sizeLimit: 20Gi
