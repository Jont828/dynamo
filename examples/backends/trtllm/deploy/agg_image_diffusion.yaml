#
# FLUX.2-klein-4B text-to-image serving with TensorRT-LLM. This is the
# Kubernetes equivalent of launch/agg_image_diffusion.sh.
# Request response_format=b64_json unless media storage is externally served.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-flux-image-agg
spec:
  backendFramework: trtllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/trtllm-runtime:my-tag
  - name: ImageDiffusionWorker
    type: worker
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/trtllm-runtime:my-tag
          command:
          - python3
          - -m
          - dynamo.trtllm
          args:
          - --model-path
          - black-forest-labs/FLUX.2-klein-4B
          - --served-model-name
          - black-forest-labs/FLUX.2-klein-4B
          - --modality
          - image_diffusion
          - --media-output-fs-url
          - file:///tmp/dynamo_media
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: media-output
            mountPath: /tmp/dynamo_media
        volumes:
        - name: media-output
          emptyDir:
            sizeLimit: 20Gi
