#
# GLM-Image AR/DiT disaggregation with vLLM-Omni. This is the Kubernetes
# equivalent of launch/disagg_omni_glm_image.sh.
#
# The local launcher uses shared memory between processes. A DGD runs each
# stage in a separate Pod, so this manifest uses the NIXL stage configuration
# for inter-Pod transfer. The two GPU workers may land on the same or different
# nodes. Request response_format=b64_json unless media storage is externally
# served.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-omni-glm-image-disagg
spec:
  backendFramework: vllm
  env:
  - name: AR_TP
    value: "1"
  - name: AR_GPUS
    value: "0"
  - name: DIT_TP
    value: "1"
  - name: DIT_GPUS
    value: "0"
  - name: FLASHINFER_DISABLE_VERSION_CHECK
    value: "1"
  - name: PYTHONHASHSEED
    value: "0"
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/vllm-runtime:my-tag
  - name: OmniRouter
    type: worker
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/vllm-runtime:my-tag
          workingDir: /workspace
          command:
          - python3
          - -m
          - dynamo.vllm.omni
          args:
          - --model
          - zai-org/GLM-Image
          - --omni-router
          - --stage-configs-path
          - /workspace/examples/backends/vllm/launch/stage_configs/glm_image_nixl.yaml
          - --output-modalities
          - image
          - --media-output-fs-url
          - file:///tmp/dynamo_media
          envFrom:
          - secretRef:
              name: hf-token-secret
          volumeMounts:
          - name: media-output
            mountPath: /tmp/dynamo_media
        volumes:
        - name: media-output
          emptyDir:
            sizeLimit: 20Gi
  - name: OmniArStage
    type: worker
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/vllm-runtime:my-tag
          workingDir: /workspace
          command:
          - python3
          - -m
          - dynamo.vllm.omni
          args:
          - --model
          - zai-org/GLM-Image
          - --stage-id
          - "0"
          - --stage-configs-path
          - /workspace/examples/backends/vllm/launch/stage_configs/glm_image_nixl.yaml
          - --output-modalities
          - image
          - --media-output-fs-url
          - file:///tmp/dynamo_media
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
  - name: OmniDitStage
    type: worker
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/vllm-runtime:my-tag
          workingDir: /workspace
          command:
          - python3
          - -m
          - dynamo.vllm.omni
          args:
          - --model
          - zai-org/GLM-Image
          - --stage-id
          - "1"
          - --stage-configs-path
          - /workspace/examples/backends/vllm/launch/stage_configs/glm_image_nixl.yaml
          - --output-modalities
          - image
          - --media-output-fs-url
          - file:///tmp/dynamo_media
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
