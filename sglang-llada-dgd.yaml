#
# LLaDA 2.0 diffusion language model with SGLang. Cluster copy of
# examples/backends/sglang/deploy/agg_llm_diffusion.yaml from PR #14660.
# Serving spec validated on 2026-09-10 against the 1.4.2 operator with matched
# 1.4.2 images; only the DGD name and namespace differ from the tested spec.
# Requests one H100. See diffusion-demo.md before deploying.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-llada-demo
  namespace: default
spec:
  backendFramework: sglang
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.4.2
        nodeSelector:
          agentpool: nodepool1
  - name: DiffusionLanguageWorker
    type: worker
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.2
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
          - --model-path
          - inclusionAI/LLaDA2.0-mini-preview
          - --tp-size
          - '1'
          - --skip-tokenizer-init
          - --trust-remote-code
          - --enable-metrics
          - --disable-cuda-graph
          - --disable-overlap-schedule
          - --attention-backend
          - triton
          - --dllm-algorithm
          - LowConfidence
          env:
          - name: HF_HOME
            value: /model-cache
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: '1'
            requests:
              nvidia.com/gpu: '1'
          volumeMounts:
          - name: model-cache
            mountPath: /model-cache
            subPath: dynamo-cache
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: pvc-lustre-dynamo
        nodeSelector:
          agentpool: ndh100pool
